name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Build and deploy to Railway production'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:pdf
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --frozen --config supabase/functions/send-team-invite/deno.json supabase/functions/send-team-invite/index.ts
      - run: deno lint supabase/functions/send-team-invite/index.ts supabase/functions/send-team-invite/handler.ts

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OWNER: yernarkuanysh-tech
      IMAGE: crm
      TAG: latest

    steps:
      - uses: actions/checkout@v4

      - name: login ghcr.io
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: build image
        run: docker build -t ghcr.io/$OWNER/$IMAGE:$TAG .

      - name: push image to registry
        run: docker push ghcr.io/$OWNER/$IMAGE:$TAG
      
      - name: deploy to cloud
        run: |
          curl -X POST https://backboard.railway.com/graphql/v2 \
          -H "Authorization: Bearer ${{secrets.RAILWAY_TOKEN}}" \
          -H "Content-Type: application/json" \
          -d '{"query":"mutation serviceInstanceRedeploy($serviceId: String!, $environmentId: String!) {serviceInstanceRedeploy(serviceId:$serviceId,environmentId:$environmentId)}","variables":{"serviceId":"${{secrets.RAILWAY_SERVICE_ID}}","environmentId":"${{secrets.RAILWAY_ENVIRONMENT_ID}}"}}'
